[package]
name = "claude-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Keeps Claude Desktop's local Code sessions the same in every account and switches its sign-in (macOS). Derived from cc-same 0.1.12 (MIT, see LICENSE-cc-same.txt)."
publish = false

[lib]
name = "claude_desktop"
path = "src/lib.rs"

[dependencies]
anyhow = "=1.0.104"
libc = "=0.2.180"
serde = { version = "=1.0.228", features = ["derive"] }
# No `preserve_order`: features are shared by the workspace, and it would change how
# auth-service writes JSON. See `jsonraw` for how files are kept in order without it.
serde_json = "=1.0.149"
